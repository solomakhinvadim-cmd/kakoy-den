# Собирает установочные файлы и выкладывает их на страницу Releases:
#   kakoy-den.apk — Android (ставится напрямую)
#   kakoy-den.ipa — iOS без подписи (ставится через Sideloadly / AltStore своим Apple ID)
# Запускается при каждом push в main и вручную (Actions → Build → Run workflow).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          npm install
          npx expo install --fix
      - name: Prebuild
        run: |
          npx expo prebuild --platform android --no-install
          # Название под иконкой на русском
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Какой день</string>|' android/app/src/main/res/values/strings.xml
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk kakoy-den.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: kakoy-den.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm install
          npx expo install --fix
      - name: Prebuild (с CocoaPods)
        run: npx expo prebuild --platform ios
      - name: Build unsigned .app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr kakoy-den.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: kakoy-den.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" kakoy-den.apk kakoy-den.ipa \
            --repo "${{ github.repository }}" \
            --title "Какой день — сборка ${{ github.run_number }}" \
            --notes "Android: скачайте kakoy-den.apk на телефон и откройте. iOS: установите kakoy-den.ipa через Sideloadly или AltStore."
